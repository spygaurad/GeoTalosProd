# =============================================================================
# Martin vector tile server configuration
# https://maplibre.org/martin/config-file.html
#
# Martin connects to app-db with the martin_reader role (SELECT-only,
# BYPASSRLS).  It serves PostGIS geometry columns as Mapbox Vector Tiles.
#
# DATABASE_URL is injected by docker-compose from the MARTIN_READER_PASSWORD
# environment variable — this file controls *which* tables are exposed and
# how, not the connection credentials.
# =============================================================================

# Worker threads
worker_processes: 1

# HTTP keep-alive timeout in seconds
keep_alive: 75

# PostGIS sources — explicit list prevents accidental exposure of system
# tables, audit logs, or tables with no geometry.
postgres:
  # Martin v1.4+ requires the connection string in the config when a config
  # file is loaded — DATABASE_URL env var is ignored in that case.
  # The ${DATABASE_URL} syntax is supported natively by martin's config loader.
  connection_string: ${DATABASE_URL}

  # Maximum pool size per worker
  pool_size: 5

  # Tables to expose as vector tile sources.
  # Each entry maps to a tile source at /martin/<source_id>/{z}/{x}/{y}
  #
  # ! martin_reader bypasses row-level security.
  # Keep the raw annotations table out of the exposed table sources
  # because direct access could reveal other organizations' annotations.
  # * Migration 042 creates the annotation_set_mvt function.
  # TODO: Implement the authenticated FastAPI vector-tile proxy.
  # Planned route:
  # GET /api/v1/annotation-sets/{set_id}/tiles/{z}/{x}/{y}.pbf
  # The proxy must authenticate callers and verify set ownership
  # before forwarding requests to Martin.

  tables:
    # Dataset spatial extents — used for rendering dataset coverage on the map
    datasets:
      schema: public
      table: datasets
      srid: 4326
      geometry_column: geometry
      geometry_type: Polygon

    # Static vector features (roads, buildings, boundaries)
    feature_layers:
      schema: public
      table: feature_layers
      srid: 4326
      geometry_column: geometry
      geometry_type: Geometry

  # Function sources — parameterised SQL functions returning ST_AsMVT bytes.
  functions:
    # Per-set annotation tiles selected by the set_id query parameter.
    # ! This function does not enforce organization ownership.
    # TODO: Enforce ownership in the planned FastAPI proxy.
    annotation_set_mvt:
      schema: public
      function: annotation_set_mvt

    # Public reference layer served live from PostGIS (migration 074). Small layers
    # only; large ones are PMTiles below. Only names in REFERENCE_LAYERS
    # (app/api/v1/endpoints/reference_layers.py) are exposed by the API.
    ramsar:
      schema: reference
      function: ramsar_mvt

# Large public reference layers: PMTiles files in the MinIO reference-tiles bucket
# (scripts/reference_layers/). The source name is the Martin id used in REFERENCE_LAYERS
# (app/api/v1/endpoints/reference_layers.py). Martin reads them as the read-only MinIO
# user created by minio-setup; the password comes from the environment.
pmtiles:
  allow_http: true
  endpoint: http://minio:9000
  region: us-east-1
  virtual_hosted_style_request: false   # MinIO needs path-style URLs
  access_key_id: ${MARTIN_TILES_USER}
  secret_access_key: ${MARTIN_TILES_PASSWORD}
  sources:
    cofopri: s3://reference-tiles/cofopri.pmtiles
    raisg_protected_areas: s3://reference-tiles/raisg_protected_areas.pmtiles
    raisg_mining: s3://reference-tiles/raisg_mining.pmtiles
    gfw_mining: s3://reference-tiles/gfw_mining.pmtiles
    gfw_logging: s3://reference-tiles/gfw_logging.pmtiles
    hydrorivers: s3://reference-tiles/hydrorivers.pmtiles
    mrds: s3://reference-tiles/mrds.pmtiles

[tool.poetry]
name = "awakeforest"
version = "0.1.0"
description = "AwakeForest Geospatial Platform"
authors = ["AwakeForest Team"]
packages = [{ include = "app" }, { include = "geoops" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
psycopg2-binary = "^2.9"
psycopg = { version = "^3.1", extras = ["binary", "pool"] }

alembic = "^1.14"
geoalchemy2 = "^0.15"

# Validation
pydantic = "^2.9"
pydantic-settings = "^2.6"

# Task queue
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.2"
flower = "^2.0"

# AWS
boto3 = "^1.35"

# Geospatial
rasterio = "^1.4"
shapely = "^2.0"
pyproj = "^3.7"
pypgstac = "^0.9.2"

# Exemplar-scan overlap merge (Detections.with_nms) — pure numpy/opencv, no
# torch. (sahi was considered for the slicing step too, but sahi>=0.11 hard-
# depends on torch>=2.4.1 even just to import sahi.slicing — would drag the
# full torch/CUDA stack into this image, which the geoops-service split
# exists to avoid. Overlapping-tile slicing is reimplemented directly in
# geoops/exemplar_tasks.py instead.)
supervision = "^0.25"

# HTTP client (STAC proxy, alert webhooks)
httpx = "^0.28"

# Auth
svix = "^1.37"
python-jose = { extras = ["cryptography"], version = "^3.3" }
pgvector = "^0.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
factory-boy = "^3.3"
moto = { extras = ["s3"], version = "^5.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
